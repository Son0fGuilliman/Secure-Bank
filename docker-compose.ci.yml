version: '3.8'

# Docker compose khusus untuk Jenkins CI/CD
# Lebih ringan dari production compose

networks:
  ci-network:
    driver: bridge

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  postgres_sonar:

services:

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: securebank-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      # Mount Docker socket agar Jenkins bisa jalankan Docker
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - ci-network
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: securebank-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres-sonar:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar123
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - postgres-sonar
    networks:
      - ci-network
    restart: unless-stopped

  postgres-sonar:
    image: postgres:16-alpine
    container_name: securebank-sonar-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar123
    volumes:
      - postgres_sonar:/var/lib/postgresql/data
    networks:
      - ci-network
    restart: unless-stopped