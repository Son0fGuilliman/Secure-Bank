version: '3.8'

# ── NETWORKS ──────────────────────────────────────
# Sesuai arsitektur Project 1: 3 server terpisah
networks:
  # Internet zone → APP server
  app-network:
    driver: bridge
  # APP server → DB server (internal only)
  db-network:
    driver: bridge
    internal: true
  # APP server → Blockchain server (internal only)
  blockchain-network:
    driver: bridge
    internal: true

# ── VOLUMES ───────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

# ── SERVICES ──────────────────────────────────────
services:

  # ── APP SERVER ──────────────────────────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: securebank-nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securebank-frontend
    environment:
      - VITE_API_URL=/api/v1
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securebank-backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://securebank:securebank123@postgres:5432/securebank
      - REDIS_URL=redis://:redis123@redis:6379
      - JWT_PRIVATE_KEY_PATH=./keys/private.key
      - JWT_PUBLIC_KEY_PATH=./keys/public.key
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - OTP_SECRET=${OTP_SECRET}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - PORT=3000
      - FRONTEND_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
      - db-network
      - blockchain-network
    restart: unless-stopped

  # ── DB SERVER ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: securebank-postgres
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # TIDAK ada ports: — tidak di-expose ke luar
    networks:
      - db-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securebank-redis
    command: redis-server --requirepass redis123 --appendonly yes
    volumes:
      - redis_data:/data
    # TIDAK ada ports: — tidak di-expose ke luar
    networks:
      - db-network
    restart: unless-stopped

  # ── BLOCKCHAIN SERVER ────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: securebank-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - blockchain-network
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: securebank-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - blockchain-network
    restart: unless-stopped